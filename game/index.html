<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>The Velvet Vault — a quiet heist in three rooms</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0a16; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript><p style="color:#e8e2f5;font:16px system-ui,sans-serif;padding:2em">The Velvet Vault needs JavaScript to play.</p></noscript>
<canvas id="game" aria-label="The Velvet Vault: sneak past guards and cameras, steal every piece of loot, and reach the exit before the alarm hits 100 percent"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
